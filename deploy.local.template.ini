# deploy.local.ini — Machine-specific paths for deploy.ps1
# Copy this file to deploy.local.ini and fill in your paths.
# deploy.local.ini is gitignored and will NOT be committed.

[paths]
# Full path to qgis-bin.exe (or qgis-ltr-bin.exe)
qgis_exe = C:\OSGeo4W\bin\qgis-bin.exe

# QGIS plugin install directory (usually %APPDATA%\QGIS\QGIS3\profiles\default\python\plugins)
# Leave empty to auto-detect from %APPDATA%
plugin_dir =

# Optional: path to local AETHER binaries to copy into the plugin
# Leave empty to skip binary copying
aether_bin_dir = C:\Users\YourName\RustroverProjects\AETHER\bin

[qgis4]
# Optional: a QGIS 4 (Qt6) install for `python deploy.py --qgis 4` / `--qgis both`.
# Full path to its qgis-bin.exe (OSGeo4W Qt6 builds ship as qgis-qt6-bin.exe).
qgis_exe =

# Its plugin dir. Leave empty to auto-detect %APPDATA%\QGIS\QGIS4\profiles\default\python\plugins
plugin_dir =
