# ===========================================================================
# torture.local.template.ini — template for torture.local.ini
# ===========================================================================
# Copy to torture.local.ini and fill in what you have. torture.local.ini is
# gitignored and will NOT be committed; this template is.
#
#   cp torture.local.template.ini torture.local.ini
#   python3 tools/make_torture_project.py            # builds data/torture/
#
# See torture.local.ini (or the header of tools/make_torture_project.py) for
# what every key does and where to get it.
# ===========================================================================

[keys]
# MapTiler API key — guide rows 1.3a and 1.4. https://cloud.maptiler.com/account/keys/
maptiler_key =
# Mapbox access token (optional, "pk...."). https://account.mapbox.com/access-tokens/
mapbox_token =
# Nextzen API key (optional). https://developers.nextzen.org/
nextzen_key =

[paths]
out_dir = data/torture
swissalti_tiles = data/swissaltiregio_tiles
swissbuildings3d =
# Optional: qgis-bin.exe for the generated open_in_qgis.bat launcher.
qgis_exe =

[options]
qgis_version = 3.34.0-Prizren
project_crs = EPSG:4326
swiss_tiles = 2585-1194,2595-1194,2585-1204,2595-1204
terrain_rgb_zooms = 10,11,12,13
terrain_rgb_base_url = http://localhost:8000/terrain-rgb
# Serve the Terrain-RGB fixture from inside QGIS (127.0.0.1 only) on open.
tile_server_autostart = true
make_monolith = true
monolith_mb = 600
overpass_url = https://overpass-api.de/api/interpreter
